# Demo Pure Obstacle Avoidance
# Xe tự do di chuyển và né vật cản

name: "Free Roam Obstacle Avoidance"
description: "Robot freely navigates while avoiding obstacles"

# No waypoints - pure obstacle avoidance mode
waypoints: []

# Car starting position
car_start_x: 4.0
car_start_y: 4.0
car_start_heading: 45.0

# More obstacles for challenge
obstacles:
  - type: "box"
    x: 2.0
    y: 2.0
    width: 0.8
    height: 0.8
    
  - type: "box"
    x: 6.0
    y: 2.0
    width: 0.8
    height: 0.8
    
  - type: "box"
    x: 2.0
    y: 6.0
    width: 0.8
    height: 0.8
    
  - type: "box"
    x: 6.0
    y: 6.0
    width: 0.8
    height: 0.8
    
  - type: "circle"
    x: 4.0
    y: 4.0
    radius: 0.5
